,"stack-md":"16px","stack-lg":"32px","unit":"8px","stack-sm":"8px","gutter":"16px"},"fontFamily":{"body-lg":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"label-bold":["Plus Jakarta Sans"],"headline-lg-mobile":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"headline-lg":["Plus Jakarta Sans"],"display":["Plus Jakarta Sans"]},"fontSize":{"body-lg":["18px",{"lineHeight":"28px","fontWeight":"500"}],"headline-md":["24px",{"lineHeight":"32px","fontWeight":"700"}],"label-bold":["14px",{"lineHeight":"20px","fontWeight":"700"}],"headline-lg-mobile":["24px",{"lineHeight":"32px","fontWeight":"700"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"label-sm":["12px",{"lineHeight":"16px","fontWeight":"600"}],"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.01em","fontWeight":"700"}],"display":["40px",{"lineHeight":"48px","letterSpacing":"-0.02em","fontWeight":"800"}]}}}}</script><style>

  </head><body class="bg-surface font-body-md text-on-surface"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-gutter flex items-center gap-stack-md"><button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-on-surface/5" onclick="history.back()"><span class="material-symbols-outlined text-secondary">arrow_back</span></button><h1 class="font-headline-md text-headline-md text-on-surface">Create Plan</h1></div></header><main class="pt-16 min-h-screen bg-surface pb-safe"><div class="flex flex-col w-full p-container-margin gap-stack-lg animate-[fadeIn_0.3s_ease-out]">
<!-- Location and Description -->
<div class="flex flex-col gap-stack-md">
<label class="font-label-bold text-on-surface">Detalles principales</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary group-focus-within:text-primary transition-colors">location_on</span>
<input class="w-full bg-surface-container/30 hover:bg-surface-container/50 focus:bg-surface-container-low transition-colors rounded-xl py-4 pl-12 pr-4 font-body-md text-on-surface placeholder:text-outline-variant outline-none focus:ring-1 focus:ring-primary shadow-sm" placeholder="¿Dónde vamos?" type="text"/>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-4 text-secondary group-focus-within:text-primary transition-colors">description</span>
<textarea class="w-full bg-surface-container/30 hover:bg-surface-container/50 focus:bg-surface-container-low transition-colors rounded-xl py-4 pl-12 pr-4 font-body-md text-on-surface placeholder:text-outline-variant outline-none focus:ring-1 focus:ring-primary shadow-sm resize-none" placeholder="Añade una descripción..." rows="3"></textarea>
</div>
</div>
<!-- Date and Time -->
<div class="flex flex-col gap-stack-md">
<label class="font-label-bold text-on-surface">Fecha y hora</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary group-focus-within:text-primary transition-colors">calendar_month</span>
<input class="w-full bg-surface-container/30 hover:bg-surface-container/50 focus:bg-surface-container-low transition-colors rounded-xl py-4 pl-12 pr-4 font-body-md text-on-surface placeholder:text-outline-variant outline-none focus:ring-1 focus:ring-primary shadow-sm appearance-none" type="date"/>
</div>
<div class="flex gap-gutter">
<div class="relative group flex-1">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary group-focus-within:text-primary transition-colors">schedule</span>
<input class="w-full bg-surface-container/30 hover:bg-surface-container/50 focus:bg-surface-container-low transition-colors rounded-xl py-4 pl-12 pr-4 font-body-md text-on-surface placeholder:text-outline-variant outline-none focus:ring-1 focus:ring-primary shadow-sm appearance-none" type="time"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 text-label-sm text-outline">Inicio</span>
</div>
<div class="relative group flex-1">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary group-focus-within:text-primary transition-colors">update</span>
<input class="w-full bg-surface-container/30 hover:bg-surface-container/50 focus:bg-surface-container-low transition-colors rounded-xl py-4 pl-12 pr-4 font-body-md text-on-surface placeholder:text-outline-variant outline-none focus:ring-1 focus:ring-primary shadow-sm appearance-none" type="time"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 text-label-sm text-outline">Fin</span>
</div>
</div>
</div>
<!-- Environment Type -->
<div class="flex flex-col gap-stack-md">
<label class="font-label-bold text-on-surface">Tipo de espacio</label>
<div class="flex bg-surface-container/50 rounded-xl p-1 relative shadow-inner">
<div class="absolute bg-secondary h-[calc(100%-8px)] w-[calc(50%-4px)] rounded-lg transition-transform duration-300 ease-in-out shadow-sm top-1 left-1" id="env-slider"></div>
<button class="flex-1 relative z-10 flex items-center justify-center gap-2 py-3 rounded-lg font-label-bold transition-colors text-on-secondary" id="btn-outdoor" onclick="selectEnvironment('outdoor')">
<span class="material-symbols-outlined text-[20px]">sunny</span>
                Al aire libre
            </button>
<button class="flex-1 relative z-10 flex items-center justify-center gap-2 py-3 rounded-lg font-label-bold transition-colors text-on-surface-variant hover:text-on-surface" id="btn-indoor" onclick="selectEnvironment('indoor')">
<span class="material-symbols-outlined text-[20px]">home</span>
                Interior
            </button>
</div>
</div>
<!-- Weather Conditions -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-bold text-on-surface">Condiciones climáticas deseables</label>
<p class="font-body-md text-on-surface-variant text-sm mb-2">Selecciona al menos una opción para optimizar sugerencias.</p>
<div class="flex flex-wrap gap-2">
<!-- Chips -->
<button class="weather-chip flex items-center gap-2 px-4 py-2 rounded-full bg-secondary text-on-secondary font-label-bold shadow-sm transition-all duration-200 active:scale-95" onclick="toggleChip(this)">
<span class="material-symbols-outlined text-[18px]">wb_sunny</span>
                Soleado
            </button>
<button class="weather-chip flex items-center gap-2 px-4 py-2 rounded-full bg-secondary-container text-on-secondary-container font-label-bold shadow-sm transition-all duration-200 active:scale-95 hover:bg-secondary-fixed" onclick="toggleChip(this)">
<span class="material-symbols-outlined text-[18px]">cloud</span>
                Nublado
            </button>
<button class="weather-chip flex items-center gap-2 px-4 py-2 rounded-full bg-secondary-container text-on-secondary-container font-label-bold shadow-sm transition-all duration-200 active:scale-95 hover:bg-secondary-fixed" onclick="toggleChip(this)">
<span class="material-symbols-outlined text-[18px]">rainy</span>
                Lluvia
            </button>
<button class="weather-chip flex items-center gap-2 px-4 py-2 rounded-full bg-secondary-container text-on-secondary-container font-label-bold shadow-sm transition-all duration-200 active:scale-95 hover:bg-secondary-fixed" onclick="toggleChip(this)">
<span class="material-symbols-outlined text-[18px]">air</span>
                Viento
            </button>
<button class="weather-chip flex items-center gap-2 px-4 py-2 rounded-full bg-secondary text-on-secondary font-label-bold shadow-sm transition-all duration-200 active:scale-95" onclick="toggleChip(this)">
<span class="material-symbols-outlined text-[18px]">thermostat</span>
                Templado
            </button>
<button class="weather-chip flex items-center gap-2 px-4 py-2 rounded-full bg-secondary-container text-on-secondary-container font-label-bold shadow-sm transition-all duration-200 active:scale-95 hover:bg-secondary-fixed" onclick="toggleChip(this)">
<span class="material-symbols-outlined text-[18px]">ac_unit</span>
                Nieve
            </button>
</div>
</div>
<!-- Save Button -->
<div class="mt-4 pb-stack-lg">
<button class="w-full flex items-center justify-center gap-2 bg-secondary hover:bg-on-secondary-container text-on-secondary font-label-bold text-[16px] py-4 rounded-xl shadow-md transition-all duration-200 active:scale-[0.98] active:shadow-sm">
<span class="material-symbols-outlined">add_task</span>
            Guardar actividad
        </button>
</div>
</div>
<script>
    // Segmented Control Logic
    function selectEnvironment(type) {
        const slider = document.getElementById('env-slider');
        const btnOutdoor = document.getElementById('btn-outdoor');
        const btnIndoor = document.getElementById('btn-indoor');

        if (type === 'outdoor') {
            slider.style.transform = 'translateX(0)';
            btnOutdoor.classList.replace('text-on-surface-variant', 'text-on-secondary');
            btnOutdoor.classList.remove('hover:text-on-surface');
            
            btnIndoor.classList.replace('text-on-secondary', 'text-on-surface-variant');
            btnIndoor.classList.add('hover:text-on-surface');
        } else {
            slider.style.transform = 'translateX(100%)';
            btnIndoor.classList.replace('text-on-surface-variant', 'text-on-secondary');
            btnIndoor.classList.remove('hover:text-on-surface');
            
            btnOutdoor.classList.replace('text-on-secondary', 'text-on-surface-variant');
            btnOutdoor.classList.add('hover:text-on-surface');
        }
    }

    // Chip Toggle Logic
    function toggleChip(element) {
        const isActive = element.classList.contains('bg-secondary');
        
        if (isActive) {
            element.classList.replace('bg-secondary', 'bg-secondary-container');
            element.classList.replace('text-on-secondary', 'text-on-secondary-container');
            element.classList.add('hover:bg-secondary-fixed');
        } else {
            element.classList.replace('bg-secondary-container', 'bg-secondary');
            element.classList.replace('text-on-secondary-container', 'text-on-secondary');
            element.classList.remove('hover:bg-secondary-fixed');
        }
        
        // Simple haptic feedback simulation
        element.style.transform = 'scale(0.9)';
        setTimeout(() => {
            element.style.transform = '';
        }, 150);
    }
</script>
<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style></main></body></html>
