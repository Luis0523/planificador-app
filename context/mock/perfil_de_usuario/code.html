<div class="w-full flex flex-col gap-stack-md relative">

<div class="relative w-full flex items-center bg-surface-container-low rounded-xl px-4 py-3 border border-transparent transition-all">

</div>
<div class="flex flex-col gap-unit group relative">
<label class="font-label-sm text-label-sm text-on-surface-variant px-unit transition-colors group-focus-within:text-primary" for="fullname">Full Name</label>
<div class="relative w-full flex items-center bg-primary/10 rounded-xl px-4 py-3 border border-transparent transition-all focus-within:border-primary focus-within:bg-primary/[0.15]">

</div>

</div>
<div class="px-container-margin py-stack-md mt-auto">
<button class="w-full bg-secondary text-on-secondary font-label-bold text-label-bold py-4 rounded-xl shadow-md flex items-center justify-center gap-2 transform transition-all active:scale-[0.98] hover:-translate-y-0.5 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 focus:ring-offset-surface" id="save-btn">
<span>Guardar cambios</span>
<span class="material-symbols-outlined text-[20px] transition-transform duration-300" id="save-icon">check_circle</span>
</button>
</div>
<div class="fixed top-20 left-1/2 -translate-x-1/2 bg-surface-container-highest text-on-surface font-label-bold text-label-bold px-4 py-2 rounded-lg shadow-xl flex items-center gap-2 opacity-0 pointer-events-none transition-opacity duration-300 z-50" id="toast">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">task_alt</span>
      Changes Saved
  </div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const saveBtn = document.getElementById('save-btn');
      const saveIcon = document.getElementById('save-icon');
      const toast = document.getElementById('toast');
      
      saveBtn.addEventListener('click', (e) => {
        e.preventDefault();
        
        saveBtn.classList.add('bg-primary', 'text-on-primary');
        saveBtn.classList.remove('bg-secondary', 'text-on-secondary');
        saveIcon.style.transform = 'rotate(360deg)';
        
        toast.classList.remove('opacity-0');
        toast.classList.add('opacity-100');
        
        setTimeout(() => {
          saveBtn.classList.remove('bg-primary', 'text-on-primary');
          saveBtn.classList.add('bg-secondary', 'text-on-secondary');
          saveIcon.style.transform = 'rotate(0deg)';
          
          toast.classList.remove('opacity-100');
          toast.classList.add('opacity-0');
        }, 2000);
      });
      
      const avatarBtn = document.querySelector('#avatar-container button');
      const avatarImg = document.querySelector('#avatar-container img');
      
      avatarBtn.addEventListener('click', () => {
          avatarImg.style.opacity = '0.7';
          setTimeout(() => {
             avatarImg.style.opacity = '1';
          }, 150);
      })
    });
  </script>
