  </head><body class="bg-surface font-body-md text-on-surface"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-container-margin flex items-center justify-between"><div class="flex items-center gap-2"><img alt="Planazo Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDeUgSMNUqugYkhWA-vt03wRk7ewgFOJW8d0hvKnZNL1XbdVNQ_UZdAKvpljHmWo4iFqJbgUz0XwmTLFK8KPKI3JdIOWAxPjBB8HudcW7_6fhNn4PyVmAUl0aLNsXpdyZp8vhIOPPAxmZnP3D4ovnq7kJE-ZtXnRFbOak54Dh0xAiU0aOA2HEM81svPB5WfSrlRD6503zeQBejgRMKMTrtTRAnArhB82SoC7jfFIZGXfvFIK07oMydy"/><span class="font-headline-md text-headline-md text-on-surface">Planazo</span></div><div class="flex items-center gap-stack-md"><span class="font-label-bold text-label-bold text-on-surface-variant">Home</span><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="pt-16 min-h-screen bg-surface"><div class="flex flex-col w-full h-full px-container-margin py-stack-lg gap-stack-lg bg-surface">
<div class="flex flex-col items-center text-center gap-stack-sm pt-8">
<div class="w-16 h-16 rounded-full bg-secondary-container flex items-center justify-center mb-4 shadow-[0px_4px_12px_rgba(74,40,112,0.08)] relative overflow-hidden group">
<div class="absolute inset-0 bg-primary/10 rounded-full scale-0 group-hover:scale-150 transition-transform duration-500 ease-out origin-center"></div>
<span class="material-symbols-outlined text-on-secondary-container text-[32px] relative z-10 transition-transform group-hover:scale-110 group-hover:rotate-12 duration-300">lock_reset</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-secondary-container">Crea tu nueva contraseña</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">Por seguridad, ingresa una nueva contraseña antes de continuar.</p>
</div>
<form class="flex flex-col gap-stack-md w-full mt-4" id="password-form">
<div class="flex flex-col gap-unit relative">
<label class="font-label-bold text-label-bold text-on-surface ml-1" for="new-password">Nueva contraseña</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-low text-on-surface font-body-lg text-body-lg rounded-lg px-4 pr-12 transition-all duration-300 focus:outline-none focus:ring-1 focus:ring-secondary focus:bg-surface-container shadow-[0px_2px_8px_rgba(74,40,112,0.04)] focus:shadow-[0px_4px_16px_rgba(74,40,112,0.12)] hover:-translate-y-[1px]" id="new-password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 h-full px-4 flex items-center justify-center text-secondary hover:text-primary transition-colors focus:outline-none" data-target="new-password" type="button">
<span class="material-symbols-outlined text-[24px]" id="eye-icon-new">visibility_off</span>
</button>
</div>
<div class="mt-2 flex flex-col gap-2 px-1">
<div class="flex items-center justify-between">
<span class="font-label-sm text-label-sm text-on-surface-variant" id="strength-text">Seguridad de la contraseña</span>
</div>
<div class="h-2 w-full bg-surface-variant rounded-full overflow-hidden flex">
<div class="h-full w-0 transition-all duration-500 ease-out" id="strength-bar"></div>
</div>
</div>
</div>
<div class="flex flex-col gap-unit relative">
<label class="font-label-bold text-label-bold text-on-surface ml-1" for="confirm-password">Confirmar nueva contraseña</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-low text-on-surface font-body-lg text-body-lg rounded-lg px-4 pr-12 transition-all duration-300 focus:outline-none focus:ring-1 focus:ring-secondary focus:bg-surface-container shadow-[0px_2px_8px_rgba(74,40,112,0.04)] focus:shadow-[0px_4px_16px_rgba(74,40,112,0.12)] hover:-translate-y-[1px]" id="confirm-password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 h-full px-4 flex items-center justify-center text-secondary hover:text-primary transition-colors focus:outline-none" data-target="confirm-password" type="button">
<span class="material-symbols-outlined text-[24px]" id="eye-icon-confirm">visibility_off</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-error h-4 mt-1 ml-1 opacity-0 transition-opacity duration-300" id="match-error">Las contraseñas no coinciden</p>
</div>
<button class="w-full h-14 mt-6 bg-secondary text-on-secondary font-label-bold text-body-lg rounded-lg shadow-[0px_4px_12px_rgba(74,40,112,0.15)] hover:shadow-[0px_6px_16px_rgba(74,40,112,0.2)] hover:-translate-y-[2px] active:translate-y-[0px] transition-all duration-200 flex items-center justify-center gap-2 relative overflow-hidden group" type="submit">
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-in-out"></div>
<span class="relative z-10">Guardar contraseña</span>
<span class="material-symbols-outlined text-[20px] relative z-10 transition-transform group-hover:translate-x-1 duration-300">arrow_forward</span>
</button>
</form>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const toggleButtons = document.querySelectorAll('button[aria-label="Toggle password visibility"]');
        const newPasswordInput = document.getElementById('new-password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const strengthBar = document.getElementById('strength-bar');
        const strengthText = document.getElementById('strength-text');
        const matchError = document.getElementById('match-error');
        const form = document.getElementById('password-form');

        // Toggle password visibility
        toggleButtons.forEach(button => {
            button.addEventListener('click', () => {
                const targetId = button.getAttribute('data-target');
                const input = document.getElementById(targetId);
                const icon = button.querySelector('.material-symbols-outlined');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility';
                    icon.classList.add('text-primary');
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility_off';
                    icon.classList.remove('text-primary');
                }
                
                // Add a little bounce effect to the icon
                icon.style.transform = 'scale(0.8)';
                setTimeout(() => { icon.style.transform = 'scale(1)'; }, 150);
                icon.style.transition = 'transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            });
        });

        // Password strength logic
        newPasswordInput.addEventListener('input', () => {
            const val = newPasswordInput.value;
            let strength = 0;
            
            if (val.length > 0) strength += 1;
            if (val.length >= 8) strength += 1;
            if (val.match(/[A-Z]/)) strength += 1;
            if (val.match(/[0-9]/)) strength += 1;
            if (val.match(/[^a-zA-Z0-9]/)) strength += 1;

            strengthBar.className = 'h-full transition-all duration-500 ease-out';
            
            if (val.length === 0) {
                strengthBar.style.width = '0%';
                strengthText.textContent = 'Seguridad de la contraseña';
                strengthText.className = 'font-label-sm text-label-sm text-on-surface-variant';
            } else if (strength <= 2) {
                strengthBar.style.width = '33%';
                strengthBar.classList.add('bg-tertiary-fixed-dim');
                strengthText.textContent = 'Débil - Usa más de 8 caracteres';
                strengthText.className = 'font-label-sm text-label-sm text-tertiary';
            } else if (strength <= 4) {
                strengthBar.style.width = '66%';
                strengthBar.classList.add('bg-primary-container');
                strengthText.textContent = 'Buena - Agrega símbolos o mayúsculas';
                strengthText.className = 'font-label-sm text-label-sm text-primary';
            } else {
                strengthBar.style.width = '100%';
                strengthBar.classList.add('bg-secondary');
                strengthText.textContent = 'Excelente - Contraseña muy segura';
                strengthText.className = 'font-label-sm text-label-sm text-secondary';
                
                // Add a subtle success pulse to the input
                newPasswordInput.classList.add('ring-2', 'ring-secondary');
                setTimeout(() => newPasswordInput.classList.remove('ring-2'), 1000);
            }
            
            checkMatch();
        });

        // Confirm password matching
        confirmPasswordInput.addEventListener('input', checkMatch);

        function checkMatch() {
            if (confirmPasswordInput.value.length > 0) {
                if (newPasswordInput.value !== confirmPasswordInput.value) {
                    matchError.classList.remove('opacity-0');
                    confirmPasswordInput.classList.add('ring-1', 'ring-error', 'focus:ring-error');
                    confirmPasswordInput.classList.remove('focus:ring-secondary');
                } else {
                    matchError.classList.add('opacity-0');
                    confirmPasswordInput.classList.remove('ring-1', 'ring-error', 'focus:ring-error');
                    confirmPasswordInput.classList.add('focus:ring-secondary');
                    
                    // Add a tiny success shake when they match perfectly
                    if(newPasswordInput.value.length > 3) {
                         confirmPasswordInput.style.transform = 'translateY(1px)';
                         setTimeout(() => confirmPasswordInput.style.transform = 'translateY(0)', 150);
                    }
                }
            } else {
                matchError.classList.add('opacity-0');
                confirmPasswordInput.classList.remove('ring-1', 'ring-error', 'focus:ring-error');
                confirmPasswordInput.classList.add('focus:ring-secondary');
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (newPasswordInput.value === confirmPasswordInput.value && newPasswordInput.value.length > 0) {
                const btn = form.querySelector('button[type="submit"]');
                const originalContent = btn.innerHTML;
                
                // Simulate saving state
                btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span class="relative z-10 ml-2">Guardando...</span>`;
                btn.classList.add('opacity-80', 'pointer-events-none');
                
                // You would normally do your fetch/submit here.
                setTimeout(() => {
                    btn.innerHTML = `<span class="material-symbols-outlined text-[20px]">check_circle</span><span class="relative z-10 ml-2">¡Listo!</span>`;
                    btn.classList.remove('bg-secondary', 'opacity-80');
                    btn.classList.add('bg-[#5d3b83]'); // darker success state using brand color
                    
                    setTimeout(() => {
                        // Reset or redirect
                        btn.innerHTML = originalContent;
                        btn.classList.remove('bg-[#5d3b83]', 'pointer-events-none');
                        btn.classList.add('bg-secondary');
                    }, 2000);
                }, 1500);
            } else {
               checkMatch();
               // Shake form on invalid submit
               form.style.transform = 'translateX(-4px)';
               setTimeout(() => form.style.transform = 'translateX(4px)', 100);
               setTimeout(() => form.style.transform = 'translateX(-4px)', 200);
               setTimeout(() => form.style.transform = 'translateX(0)', 300);
               form.style.transition = 'transform 0.1s ease-in-out';
            }
        });
    });
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-secondary bg-primary-container/20 rounded-xl"><div class="h-20 flex justify-around items-center px-gutter"><a aria-current="page" class="flex flex-col items-center gap-1 p-2 transition-all duration-200 text-secondary bg-primary-container/20 rounded-xl" data-path="home" href="#"><span class="material-symbols-outlined">home</span><span class="font-label-sm text-label-sm">Home</span></a><a class="flex flex-col items-center gap-1 p-2 transition-all duration-200 text-on-surface-variant" data-path="locations" href="#"><span class="material-symbols-outlined">location_on</span><span class="font-label-sm text-label-sm">Locations</span></a><a class="flex flex-col items-center gap-1 p-2 transition-all duration-200 text-on-surface-variant" data-path="pending-activities" href="#"><span class="material-symbols-outlined">pending_actions</span><span class="font-label-sm text-label-sm">Pending</span></a></div></nav></body></html>
