<div class="flex flex-col items-center justify-center gap-unit text-center">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-stack-sm shadow-sm relative overflow-hidden group">
<span class="material-symbols-outlined text-[32px] text-on-primary-container z-10 transition-transform duration-300 group-hover:scale-110">celebration</span>
<div class="absolute inset-0 bg-secondary/10 rounded-full scale-0 transition-transform duration-300 group-hover:scale-150"></div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Crea tu cuenta</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">Únete a Planazo y empieza a organizar momentos inolvidables con tus amigos.</p>
</div>
<form class="flex flex-col gap-stack-md w-full max-w-[400px] mx-auto" id="registration-form">
<div class="flex flex-col gap-1 group">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-unit group-focus-within:text-primary transition-colors" for="fullname">Nombre completo</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl focus-within:bg-surface transition-colors shadow-[0_2px_8px_rgba(110,82,139,0.04)] focus-within:shadow-[0_4px_16px_rgba(110,82,139,0.12)]">
<span class="material-symbols-outlined text-primary ml-4 mr-2">person</span>
<input class="w-full bg-transparent py-4 pr-4 font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none" id="fullname" placeholder="Ej. Ana García" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1 group">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-unit group-focus-within:text-primary transition-colors" for="username">Nombre de usuario</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl focus-within:bg-surface transition-colors shadow-[0_2px_8px_rgba(110,82,139,0.04)] focus-within:shadow-[0_4px_16px_rgba(110,82,139,0.12)]">
<span class="material-symbols-outlined text-primary ml-4 mr-2">alternate_email</span>
<input class="w-full bg-transparent py-4 pr-4 font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none" id="username" placeholder="anagarcia123" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1 group">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-unit group-focus-within:text-primary transition-colors" for="email">Correo electrónico</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl focus-within:bg-surface transition-colors shadow-[0_2px_8px_rgba(110,82,139,0.04)] focus-within:shadow-[0_4px_16px_rgba(110,82,139,0.12)]">
<span class="material-symbols-outlined text-primary ml-4 mr-2">mail</span>
<input class="w-full bg-transparent py-4 pr-4 font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none" id="email" placeholder="hola@ejemplo.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1 group">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-unit group-focus-within:text-primary transition-colors" for="phone">Teléfono <span class="text-on-surface-variant/60 font-normal">(Opcional)</span></label>
<div class="relative flex items-center bg-surface-container-low rounded-xl focus-within:bg-surface transition-colors shadow-[0_2px_8px_rgba(110,82,139,0.04)] focus-within:shadow-[0_4px_16px_rgba(110,82,139,0.12)]">
<span class="material-symbols-outlined text-primary ml-4 mr-2">phone</span>
<input class="w-full bg-transparent py-4 pr-4 font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none" id="phone" placeholder="+34 600 000 000" type="tel"/>
</div>
</div>
<div class="flex flex-col gap-1 group">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-unit group-focus-within:text-primary transition-colors" for="password">Contraseña</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl focus-within:bg-surface transition-colors shadow-[0_2px_8px_rgba(110,82,139,0.04)] focus-within:shadow-[0_4px_16px_rgba(110,82,139,0.12)]">
<span class="material-symbols-outlined text-primary ml-4 mr-2">lock</span>
<input class="w-full bg-transparent py-4 pr-12 font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none" id="password" placeholder="Mínimo 8 caracteres" required="" type="password"/>
<button aria-label="Mostrar contraseña" class="absolute right-4 text-primary hover:text-secondary transition-colors" onclick="togglePassword('password')" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-icon">visibility</span>
</button>
</div>
</div>
<div class="flex flex-col gap-1 group">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-unit group-focus-within:text-primary transition-colors" for="confirm-password">Confirmar contraseña</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl focus-within:bg-surface transition-colors shadow-[0_2px_8px_rgba(110,82,139,0.04)] focus-within:shadow-[0_4px_16px_rgba(110,82,139,0.12)]">
<span class="material-symbols-outlined text-primary ml-4 mr-2">lock_reset</span>
<input class="w-full bg-transparent py-4 pr-12 font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none" id="confirm-password" placeholder="Repite tu contraseña" required="" type="password"/>
<button aria-label="Mostrar contraseña" class="absolute right-4 text-primary hover:text-secondary transition-colors" onclick="togglePassword('confirm-password')" type="button">
<span class="material-symbols-outlined text-[20px]" id="confirm-password-icon">visibility</span>
</button>
</div>
</div>
<button class="mt-stack-sm w-full bg-secondary text-on-secondary font-label-bold text-label-bold py-4 px-6 rounded-xl shadow-[0_4px_12px_rgba(113,78,152,0.2)] hover:-translate-y-[1px] hover:shadow-[0_6px_16px_rgba(113,78,152,0.3)] active:translate-y-[1px] active:shadow-sm transition-all duration-200 flex items-center justify-center gap-2 overflow-hidden relative" id="submit-btn" type="submit">
<span class="relative z-10 flex items-center gap-2">
        Crear cuenta
        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</span>
<div class="absolute inset-0 bg-white/20 w-full transform -translate-x-full" id="btn-flash"></div>
</button>
</form>
<div class="flex items-center justify-center gap-1 mt-auto pb-stack-lg">
<span class="font-body-md text-body-md text-on-surface-variant">¿Ya tienes cuenta?</span>
<a class="font-label-bold text-label-bold text-primary hover:text-secondary transition-colors relative after:content-[''] after:absolute after:w-full after:h-[2px] after:bg-secondary after:bottom-0 after:left-0 after:scale-x-0 hover:after:scale-x-100 after:transition-transform after:origin-left" href="#login">Inicia sesión</a>
</div>
</div>
<script>
  function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(inputId + '-icon');
    
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  document.getElementById('registration-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const flash = document.getElementById('btn-flash');
    const icon = btn.querySelector('.material-symbols-outlined');
    
    btn.style.transform = 'scale(0.98)';
    setTimeout(() => {
      btn.style.transform = '';
      flash.style.transition = 'transform 0.4s ease-in-out';
      flash.style.transform = 'translateX(100%)';
      
      icon.textContent = 'check_circle';
      icon.style.animation = 'pulse 0.5s ease-in-out';
      
      setTimeout(() => {
        flash.style.transition = 'none';
        flash.style.transform = 'translateX(-100%)';
        setTimeout(() => {
          icon.textContent = 'arrow_forward';
          icon.style.animation = 'none';
        }, 1500);
      }, 400);
    }, 150);
  });
</script>
<style>
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
</style></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-secondary bg-primary-container/20 rounded-xl"><div class="h-20 flex justify-around items-center px-gutter"><a aria-current="page" class="flex flex-col items-center gap-1 p-2 transition-all duration-200 text-secondary bg-primary-container/20 rounded-xl" data-path="home" href="#"><span class="material-symbols-outlined">home</span><span class="font-label-sm text-label-sm">Home</span></a><a class="flex flex-col items-center gap-1 p-2 transition-all duration-200 text-on-surface-variant" data-path="locations" href="#"><span class="material-symbols-outlined">location_on</span><span class="font-label-sm text-label-sm">Locations</span></a><a class="flex flex-col items-center gap-1 p-2 transition-all duration-200 text-on-surface-variant" data-path="pending-activities" href="#"><span class="material-symbols-outlined">pending_actions</span><span class="font-label-sm text-label-sm">Pending</span></a></div></nav></body></html>
